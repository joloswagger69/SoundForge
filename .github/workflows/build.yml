name: Build SoundForge Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Configure project
        run: cmake -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3
        run: cmake --build build --config Release --target SoundForge_VST3

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: SoundForge-VST3-Windows
          path: build/SoundForge_artefacts/Release/VST3/SoundForge.vst3/
          if-no-files-found: error
